server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    # ===== Cabeceras de seguridad =====
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'self'; object-src 'none'; script-src 'self' https://api.mapbox.com https://www.paypal.com https://www.paypalobjects.com https://www.google.com https://www.gstatic.com; script-src-attr 'none'; style-src 'self' 'unsafe-inline' https://api.mapbox.com; img-src 'self' data: blob: https://res.cloudinary.com https://*.mapbox.com https://*.tiles.mapbox.com https://cdn-icons-png.flaticon.com https://i.pinimg.com https://via.placeholder.com; font-src 'self' data:; connect-src 'self' https://api.mapbox.com https://events.mapbox.com https://*.tiles.mapbox.com https://*.paypal.com https://www.google.com; worker-src 'self' blob:; media-src 'self' blob:; frame-src 'self' https://www.google.com https://*.paypal.com; form-action 'self'; upgrade-insecure-requests" always;

    location /api/ {
        proxy_pass http://backend-node:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Rutas que no existen en la SPA: respuesta limpia (404)
    location ~ ^/(admin|chat|api/mensajes)(/|$) {
        return 404;
    }

    location / {
        # La SPA solo se sirve en GET/HEAD/OPTIONS; el resto es 404
        if ($request_method !~ ^(GET|HEAD|OPTIONS)$) {
            return 404;
        }
        try_files $uri $uri/ /index.html;
    }
}
